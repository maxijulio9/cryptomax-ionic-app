<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Nuevo Exchange</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()">Cerrar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form">
    <ion-item>
      <ion-label position="floating">Nombre</ion-label>
      <ion-input formControlName="name"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Tipo / Billetera</ion-label>
      <ion-input formControlName="typeWallet"></ion-input>
    </ion-item>

    <ion-footer>
      <ion-button expand="block" (click)="save()" [disabled]="form.invalid">
        Guardar
      </ion-button>
    </ion-footer>
  </form>
</ion-content>
