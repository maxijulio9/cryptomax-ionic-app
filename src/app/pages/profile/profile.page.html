<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding profile-content">
    <ion-refresher slot="fixed" (ionRefresh)="refreshPage($event.target)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="profile-header ion-text-center">
    <!-- <ion-avatar class="profile-avatar">
      <img src="assets/imgs/profile.jpeg" alt="Usuario">
    </ion-avatar> -->
    <div class="profile-avatar">
      <ion-img [src]="profileImage" alt="Foto de perfil"></ion-img>
      <ion-fab-button  (click)="takePhoto()">
        <ion-icon name="camera"></ion-icon>
      </ion-fab-button> 
    </div>

    <h2 class="profile-name ">{{ user?.name }} {{ user?.lastName }}</h2>
    <p class="profile-email">{{ user?.email }}</p>
  </div>

  <ion-card class="profile-card">
    <ion-card-header>
      <ion-card-title>Información general</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list lines="none">
        <ion-item>
          <ion-label>
            <strong>País</strong>
          </ion-label>
          <ion-note slot="end">Argentina</ion-note>
        </ion-item>
        <ion-item>
          <ion-label>
            <strong>Miembro desde</strong>
          </ion-label>
          <ion-note slot="end">2024</ion-note>
        </ion-item>
        <ion-item>
          <ion-label>
            <strong>Nivel de cuenta</strong>
          </ion-label>
          <ion-badge color="success">Verificado</ion-badge>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

  <ion-list inset="true" class="profile-options">

    <ion-item button detail (click)=" goToEditProfile()"  > 
      <ion-label>Editar información</ion-label>
    </ion-item>

    <ion-item button detail (click)="goToSecurity()">
      <ion-label>Seguridad</ion-label>
    </ion-item>

    <ion-item button detail (click)="goToReports()">
      <ion-label>Reportes</ion-label>
    </ion-item>

    <ion-item button detail (click)="goToMyTransactions()">
      <ion-label>Mis transacciones</ion-label>
    </ion-item>

    <ion-item button color="danger">
      <ion-label>Cerrar sesión</ion-label>
    </ion-item>
  </ion-list>

</ion-content>
