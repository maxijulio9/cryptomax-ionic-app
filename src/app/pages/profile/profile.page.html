<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding profile-content">

  <div class="profile-header ion-text-center">
    <ion-avatar class="profile-avatar">
      <img src="assets/coins/user.png" alt="Usuario">
    </ion-avatar>

    <h2 class="profile-name">Maximiliano Julio</h2> <!--aca se parametrizara-->
    <p class="profile-email">maxi.crypto@binance.com</p> <!--aca tmb se parametrizara-->
  </div>

  <ion-card class="profile-card">
    <ion-card-header>
      <ion-card-title>Información general</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list lines="none">
        <ion-item>
          <ion-label>
            <strong>País</strong>
          </ion-label>
          <ion-note slot="end">Argentina 🇦🇷</ion-note>
        </ion-item>
        <ion-item>
          <ion-label>
            <strong>Miembro desde</strong>
          </ion-label>
          <ion-note slot="end">2024</ion-note>
        </ion-item>
        <ion-item>
          <ion-label>
            <strong>Nivel de cuenta</strong>
          </ion-label>
          <ion-badge color="success">Verificado</ion-badge>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

  <ion-list inset="true" class="profile-options">
    <ion-item button detail>
      <ion-icon name="create-outline" slot="start"></ion-icon>
      <ion-label>Editar perfil</ion-label>
    </ion-item>

    <ion-item button detail>
      <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
      <ion-label>Reportes</ion-label>
    </ion-item>

    <ion-item button detail>
      <ion-icon name="wallet-outline" slot="start"></ion-icon>
      <ion-label>Mis transacciones</ion-label>
    </ion-item>

    <ion-item button color="danger">
      <ion-icon name="log-out-outline" slot="start"></ion-icon>
      <ion-label>Cerrar sesión</ion-label>
    </ion-item>
  </ion-list>

</ion-content>
