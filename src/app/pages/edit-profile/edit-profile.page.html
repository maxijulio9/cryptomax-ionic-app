<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/profile " text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Mi información</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true"  class="ion-padding edit-profile-content">
      
      <form [formGroup]="formEditProfile"  (ngSubmit)="saveProfile()">
        <ion-list>
          <ion-item>
            <ion-label position="floating" style="color: aliceblue;">id {{formEditProfile.get('id')?.value}}</ion-label>
          </ion-item>
         <ion-item>
            
            <ion-label position="floating">Nombre</ion-label>
            <ion-input type="text" formControlName="name"></ion-input>
          </ion-item>
          <ion-item>
            <ion-label position="floating">Apellido</ion-label>
            <ion-input type="text" formControlName="lastName"></ion-input>
          </ion-item>

          <ion-item>
            <ion-label position="floating">Correo electrónico</ion-label>
            <ion-input type="email" formControlName="email"></ion-input>
          </ion-item>

          <ion-item>
            <ion-label position="floating">DNI</ion-label>
            <ion-input type="text" formControlName="dni"></ion-input>
          </ion-item>

          <ion-item>
            <ion-label position="floating">País</ion-label>
            <ion-input type="text" formControlName="country"></ion-input>
          </ion-item>
        </ion-list>

    
        <ion-buttons >
          <ion-button (click)="saveProfile()">
            Guardar
          </ion-button> 
        </ion-buttons>
      
      </form>

      <ion-toast [isOpen]="isToastOpen" 
                 [message]="toastMessage" 
                 [duration]="2000" 
                 position="bottom"
                 [color]="toastColor">

      </ion-toast>


</ion-content>
